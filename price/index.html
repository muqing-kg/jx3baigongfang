  <style>
/* ------------------------------------------------------------------ */
/* Boot loader                                                        */
/* ------------------------------------------------------------------ */
body.booting { overflow: hidden; }

.boot-loader {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  z-index: 20000;
  display: -webkit-box;
  display: flex;
  -webkit-box-align: center;
  align-items: center;
  -webkit-box-pack: center;
  justify-content: center;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 34%, rgba(232, 84, 62, 0.14), transparent 46%),
    radial-gradient(circle at 78% 72%, rgba(69, 163, 255, 0.10), transparent 42%),
    #020817;
  color: #f8fafc;
  opacity: 1;
  transition: opacity 300ms ease;
}

.boot-loader.is-done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 300ms ease, visibility 0s linear 300ms;
}

.boot-loader__inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px;
  text-align: center;
}

.boot-loader__ring {
  position: relative;
  width: 112px;
  height: 112px;
  display: grid;
  place-items: center;
}

.boot-loader__ring::before {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  inset: 0;
  border-radius: 50%;
  border: 2px solid rgba(148, 163, 184, 0.14);
  border-top-color: #e8543e;
  border-right-color: #e8b44a;
  animation: boot-spin 1.05s linear infinite;
}

.boot-loader__mark {
  width: 76px;
  height: 76px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #ef4a36, #a80f08);
  color: #fff8ec;
  font-family: "Songti SC", "Songti TC", serif;
  font-size: 38px;
  font-weight: 900;
  box-shadow: 0 12px 30px rgba(200, 16, 46, 0.35);
}

.boot-loader__name {
  margin-top: 20px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.boot-loader__sub {
  margin-top: 6px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: #7f9bbc;
}

.boot-loader__status {
  margin-top: 26px;
  font-size: 13px;
  color: #cbd5e1;
}

.boot-loader__bar {
  margin-top: 12px;
  width: 220px;
  height: 3px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.16);
  overflow: hidden;
}

.boot-loader__bar i {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, rgba(232, 84, 62, 0), #e8543e 32%, #e8b44a 64%, rgba(232, 84, 62, 0));
  background-size: 220% 100%;
  animation: boot-bar 1.25s linear infinite;
}

.boot-loader__hint {
  margin-top: 12px;
  font-size: 11px;
  color: #64748b;
}

.boot-loader__retry {
  margin-top: 16px;
  height: 34px;
  padding: 0 16px;
  border-radius: 8px;
  border: 1px solid #2a3b55;
  background: #0b1424;
  color: #f5f1e8;
  font-size: 13px;
  font-weight: 600;
}

.boot-loader__retry:hover { background: #13203a; }

.boot-loader.is-stalled .boot-loader__ring::before {
  animation: none;
  border-color: rgba(232, 84, 62, 0.35);
}

.boot-loader.is-stalled .boot-loader__bar i {
  width: 100%;
  opacity: 0.35;
  animation: none;
}

html.light .boot-loader {
  background:
    radial-gradient(circle at 50% 34%, rgba(200, 16, 46, 0.08), transparent 46%),
    radial-gradient(circle at 78% 72%, rgba(29, 111, 224, 0.07), transparent 42%),
    #f5f5f5;
  color: #0f172a;
}
html.light .boot-loader__ring::before { border-color: #e2e8f0; border-top-color: #c8102e; border-right-color: #d99a2b; }
html.light .boot-loader__sub { color: #64748b; }
html.light .boot-loader__status { color: #475569; }
html.light .boot-loader__bar { background: #e2e8f0; }
html.light .boot-loader__hint { color: #94a3b8; }
html.light .boot-loader__retry { background: #ffffff; border-color: #cbd5e1; color: #0f172a; }
html.light .boot-loader__retry:hover { background: #f1f5f9; }
@keyframes boot-spin { to { transform: rotate(360deg); } }
@keyframes boot-bar {
  0% { background-position: 120% 0; }
  100% { background-position: -120% 0; }
}

@media (prefers-reduced-motion: reduce) {
  .boot-loader__ring::before,
  .boot-loader__bar i { animation: none; }
}
  /* 正常加载不显示遮罩，只在超时或失败时弹出重试 */
  #boot-loader { display: none; }
  #boot-loader.is-stalled { display: grid; }
  </style>
  <noscript><style>#boot-loader{display:none!important}body.booting{overflow:auto!important}</style></noscript>

<body>
  <div id="boot-loader" class="boot-loader" role="status" aria-live="polite" aria-busy="true">
    <div class="boot-loader__inner">
      <div class="boot-loader__ring" aria-hidden="true"><span class="boot-loader__mark">价</span></div>
      <div class="boot-loader__name">物价助手</div>
      <div class="boot-loader__sub">JX3 PRICE LEDGER</div>
      <div class="boot-loader__status" id="boot-status">正在载入本服行情…</div>
      <div class="boot-loader__bar" aria-hidden="true"><i></i></div>
      <div class="boot-loader__hint">首次加载或更新后可能需要几秒</div>
      <button type="button" class="boot-loader__retry" id="boot-retry" hidden>重新加载</button>
    </div>
  </div>
  <script>
  (function () {
    var el = document.getElementById('boot-loader');
    var retry = document.getElementById('boot-retry');
    function setStatus(text) {
      var node = document.getElementById('boot-status');
      if (node && text) node.textContent = text;
    }
    window.setBootStatus = setStatus;
    window.bootLoaderFail = function (message) {
      if (!el) return;
      el.classList.add('is-stalled');
      setStatus(message || '加载失败，请刷新重试');
      if (retry) retry.hidden = false;
    };
    if (retry) {
      retry.addEventListener('click', function () { location.reload(); });
    }
    var watch = window.setInterval(function () {
      if (!el || el.classList.contains('is-done')) { window.clearInterval(watch); return; }
      if (window.performance && performance.now && performance.now() < 520) return;
      if (document.querySelector('#page .page-title')) {
        el.classList.add('is-done');
        document.body.classList.remove('booting');
        window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
        window.clearInterval(watch);
      }
    }, 250);
    window.setTimeout(function () {
      if (!el || el.classList.contains('is-done')) return;
      window.bootLoaderFail('加载时间较长，请检查网络后重试');
    }, 10000);
  })();
  </script>
