name: Update JX3 prices

on:
  # 定时由 Cloudflare Worker 每小时 :31（北京时间）触发 workflow_dispatch。
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-jx3-prices.mjs'
      - 'scripts/jx3-item-map.json'
      - '.github/workflows/update-jx3-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-jx3-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate price history script
        run: node scripts/test-price-history.mjs

      - name: Update prices and rebuild minitool zip
        run: ./scripts/update-prices.sh

      - name: Commit changes
        run: |
          git config user.name "jx3-price-bot"
          git config user.email "jx3-price-bot@users.noreply.github.com"
          git add assets/data.js miniapp/src/shared/catalog.json minitool/assets/data.js scripts/jx3-item-map.json data/price-history
          git add "剑网三物价助手-minitool.zip"
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: update JX3BOX prices"
            git push
          fi

      - name: Build and sync cloud prices
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          if [ -z "$WX_APPID" ] || [ -z "$WX_APPSECRET" ] || [ -z "$TCB_ENV_ID" ]; then
            echo "WX_APPID / WX_APPSECRET / TCB_ENV_ID 未配置，跳过云同步。"
            exit 0
          fi
          node miniapp/scripts/build-remote-prices.mjs
          node miniapp/scripts/sync-cloudbase-prices.mjs
          node miniapp/scripts/sync-cloudbase-history.mjs

      - name: Upload minitool artifact
        uses: actions/upload-artifact@v4
        with:
          name: jx3-minitool
          path: "剑网三物价助手-minitool.zip"
