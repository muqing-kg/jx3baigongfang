  <text x="1110" y="402" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="20" font-weight="700" fill="#8af3bd">43.63</text>

  <line x1="700" y1="456" x2="1106" y2="456" stroke="#1e2f47" stroke-width="1"/>
  <text x="700" y="490" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="16" fill="#64748b">按每点精力收益排序 · 全站中位 0.67 金/精力</text>

  <!-- bottom disclaimer -->
  <text x="66" y="620" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="16" fill="#52657d">非官方玩家工具 · 示例价可校准 · 数据来自当前版本</text>
