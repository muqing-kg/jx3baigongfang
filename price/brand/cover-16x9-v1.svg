  <text x="1110" y="254" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="20" font-weight="700" fill="#c18aff">48.98</text>

  <circle cx="704" cy="322" r="16" fill="#0c2038" stroke="#45a3ff" stroke-width="1.2"/>
