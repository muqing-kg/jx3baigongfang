<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#071326"/>
      <stop offset="1" stop-color="#0d1e38"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a1f"/>
      <stop offset="0.55" stop-color="#e10600"/>
      <stop offset="1" stop-color="#9f0000"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b4bb3"/>
      <stop offset="1" stop-color="#45a3ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#128a52"/>
      <stop offset="1" stop-color="#5ff0a4"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6e2bbb"/>
      <stop offset="1" stop-color="#c18aff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e8a300"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d6fe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d6fe0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#7aa2d8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="120" cy="220" r="330" fill="url(#glowRed)"/>
  <circle cx="1060" cy="540" r="380" fill="url(#glowBlue)"/>

  <!-- brand -->
  <g filter="url(#shadow)">
