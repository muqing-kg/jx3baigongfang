    <text x="322" y="450" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="18" fill="#a9bdd6">项物价</text>

    <rect x="444" y="418" width="198" height="50" rx="12" fill="#0b1729" stroke="#22334b" stroke-width="1"/>
    <text x="464" y="451" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="23" font-weight="700" fill="#c18aff">17</text>
    <text x="502" y="450" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="18" fill="#a9bdd6">个服务器</text>
