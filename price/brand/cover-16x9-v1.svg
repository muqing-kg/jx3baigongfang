  <text x="1110" y="328" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="20" font-weight="700" fill="#8bc6ff">45.98</text>

  <circle cx="704" cy="396" r="16" fill="#0c2a22" stroke="#5ff0a4" stroke-width="1.2"/>
  <text x="704" y="402" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="14" font-weight="700" fill="#8af3bd">3</text>
