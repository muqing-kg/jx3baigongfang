  <text x="150" y="92" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">剑网三物价助手</text>
  <text x="152" y="118" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#7f9bbc">JX3 PRICE LEDGER</text>

