<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#081426"/>
      <stop offset="1" stop-color="#0d1b32"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff2a1f"/>
      <stop offset="0.55" stop-color="#e10600"/>
      <stop offset="1" stop-color="#9f0000"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b4bb3"/>
      <stop offset="1" stop-color="#45a3ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#128a52"/>
      <stop offset="1" stop-color="#5ff0a4"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6e2bbb"/>
      <stop offset="1" stop-color="#c18aff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#e10600" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <filter id="barGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#45a3ff" flood-opacity="0.30"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7aa2d8" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="26" y="26" width="972" height="972" rx="196" fill="none" stroke="#8fb6e8" stroke-opacity="0.12" stroke-width="2"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#grid)"/>
  <circle cx="450" cy="500" r="410" fill="url(#glow)"/>

  <!-- red seal -->
  <rect x="180" y="270" width="480" height="480" rx="106" fill="url(#red)" filter="url(#shadow)"/>
  <rect x="208" y="298" width="424" height="424" rx="84" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="3"/>
  <text x="420" y="650" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="300" font-weight="700" fill="#ffffff">价</text>

  <!-- ascending bars -->
  <g filter="url(#barGlow)">
    <rect x="700" y="650" width="54" height="150" rx="18" fill="url(#blue)"/>
    <rect x="780" y="580" width="54" height="220" rx="18" fill="url(#green)"/>
    <rect x="860" y="500" width="54" height="300" rx="18" fill="url(#purple)"/>
  </g>
  <path d="M716 620L796 550L876 470" fill="none" stroke="#f8fafc" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- coin -->
  <circle cx="850" cy="240" r="46" fill="#f5b301" filter="url(#shadow)"/>
  <circle cx="850" cy="240" r="34" fill="none" stroke="#6b4700" stroke-opacity="0.45" stroke-width="4"/>
  <text x="850" y="257" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="46" font-weight="700" fill="#3d2900">金</text>

</svg>
