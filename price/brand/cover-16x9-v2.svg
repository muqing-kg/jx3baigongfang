<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF7EC"/>
      <stop offset="0.55" stop-color="#F6EEDF"/>
      <stop offset="1" stop-color="#EFE1C9"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4A36"/>
      <stop offset="0.55" stop-color="#D0241A"/>
      <stop offset="1" stop-color="#A80F08"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8543E"/>
      <stop offset="1" stop-color="#B8120A"/>
    </linearGradient>
    <linearGradient id="barCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9B99E"/>
      <stop offset="1" stop-color="#A08E72"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3A2A14" flood-opacity="0.20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3A2A14" flood-opacity="0.16"/>
    </filter>
    <pattern id="ruled" width="1200" height="54" patternUnits="userSpaceOnUse">
      <path d="M0 53.5H1200" fill="none" stroke="#8B7A62" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#paper)"/>
  <rect width="1200" height="675" fill="url(#ruled)"/>
  <rect x="36" y="30" width="1.5" height="615" fill="#C8102E" opacity="0.16"/>
  <rect x="1162" y="30" width="1.5" height="615" fill="#C8102E" opacity="0.16"/>

  <!-- brand -->
  <g filter="url(#softShadow)">
    <rect x="64" y="46" width="68" height="68" rx="16" fill="url(#seal)"/>
  </g>
  <rect x="69" y="51" width="58" height="58" rx="11" fill="none" stroke="#FFF6E8" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="98" y="92" text-anchor="middle" font-family="Songti SC, serif" font-size="37" font-weight="900" fill="#FFF8EC">价</text>
  <text x="150" y="83" font-family="PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#14110D">剑网三物价助手</text>
  <text x="152" y="110" font-family="PingFang SC, sans-serif" font-size="12" font-weight="600" letter-spacing="2.6" fill="#8B7A62">JX3 PRICE LEDGER · 玩家自制</text>

  <rect x="982" y="58" width="154" height="42" rx="21" fill="#14110D"/>
  <circle cx="1002" cy="79" r="4" fill="#E8B44A"/>
  <text x="1064" y="85" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="16" font-weight="600" fill="#F8EFDF">免费 · 免下载</text>

  <!-- left copy -->
  <rect x="64" y="158" width="6" height="22" rx="3" fill="#C8102E"/>
  <text x="84" y="176" font-family="PingFang SC, sans-serif" font-size="20" font-weight="600" letter-spacing="2.4" fill="#B4472F">剑网3 · 苍生铸世 50 级</text>

  <text x="62" y="320" font-family="Songti SC, serif" font-size="112" font-weight="900" fill="#14110D">精力别</text>
  <text x="398" y="320" font-family="Songti SC, serif" font-size="112" font-weight="900" fill="#C8102E">乱花</text>
  <path d="M 406 336 C 458 331 528 334 600 328" fill="none" stroke="#C8102E" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>

  <text x="64" y="382" font-family="PingFang SC, sans-serif" font-size="27" font-weight="600" fill="#3B3229"><tspan fill="#C8102E" font-weight="800">154</tspan> 条制造配方，先算再做</text>

  <g transform="rotate(-0.8 360 424)">
    <rect x="64" y="400" width="588" height="50" rx="5" fill="#14110D"/>
    <rect x="82" y="412" width="4" height="26" rx="2" fill="#E8543E"/>
    <text x="102" y="433" font-family="PingFang SC, sans-serif" font-size="21" font-weight="600" fill="#D9CBB4">同样 200 精力，收益差 <tspan fill="#E8B44A" font-weight="800">132 倍</tspan></text>
    <text x="630" y="432" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#8B7A62">TOP1 vs 中位</text>
  </g>

  <!-- right card -->
  <g transform="translate(0 14) rotate(-1.4 925 330)">
    <rect x="690" y="96" width="470" height="468" rx="22" fill="#FFFCF5" filter="url(#cardShadow)"/>
    <rect x="690" y="96" width="470" height="8" rx="4" fill="#C8102E"/>

    <text x="720" y="152" font-family="Songti SC, serif" font-size="26" font-weight="900" fill="#14110D">精力收益榜</text>
    <rect x="884" y="128" width="70" height="26" rx="13" fill="#FBE7C8"/>
    <text x="919" y="147" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="13" font-weight="700" fill="#A8641B">TOP 3</text>
    <text x="1132" y="147" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="11" font-weight="500" fill="#8B7A62">金 / 精力</text>
    <path d="M720 168H1132" stroke="#14110D" stroke-opacity="0.10" stroke-width="1.2"/>

    <!-- row 1 -->
    <rect x="710" y="184" width="430" height="88" rx="13" fill="#FDF2D6"/>
    <rect x="710" y="198" width="5" height="60" rx="2.5" fill="#C8102E"/>
    <text x="730" y="232" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#B4472F">01</text>
    <text x="766" y="226" font-family="PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#14110D">归营旌</text>
    <text x="766" y="250" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#8B7A62">梓匠 · 单次 200 精力</text>
    <rect x="930" y="216" width="112" height="8" rx="4" fill="#EADCC2"/>
    <rect x="930" y="216" width="112" height="8" rx="4" fill="url(#barHot)"/>
    <text x="1124" y="236" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#C8102E">175.25</text>

    <!-- row 2 -->
    <text x="730" y="324" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#A08E72">02</text>
    <text x="766" y="318" font-family="PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#14110D">膘然心动</text>
    <text x="766" y="342" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#8B7A62">烹饪 · 单次 200 精力</text>
    <rect x="930" y="308" width="112" height="8" rx="4" fill="#EADCC2"/>
    <rect x="930" y="308" width="52" height="8" rx="4" fill="url(#barCool)"/>
    <text x="1124" y="328" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#14110D">81.37</text>

    <!-- row 3 -->
    <text x="730" y="416" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#A08E72">03</text>
    <text x="766" y="410" font-family="PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#14110D">定魂丹砂</text>
    <text x="766" y="434" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#8B7A62">制药 · 单次 200 精力</text>
    <rect x="930" y="400" width="112" height="8" rx="4" fill="#EADCC2"/>
    <rect x="930" y="400" width="36" height="8" rx="4" fill="url(#barCool)"/>
    <text x="1124" y="420" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#14110D">56.68</text>

    <text x="720" y="514" font-family="PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#8B7A62">共 162 条配方 · 全站中位 1.33 · 按每点精力排序</text>
  </g>

  <g transform="rotate(-6 1090 238)">
    <ellipse cx="1090" cy="238" rx="64" ry="26" fill="none" stroke="#C8102E" stroke-width="3.5" stroke-opacity="0.95"/>
    <ellipse cx="1092" cy="240" rx="69" ry="29" fill="none" stroke="#C8102E" stroke-width="1.6" stroke-opacity="0.40"/>
  </g>

  <!-- bottom left -->
  <text x="64" y="560" font-family="PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#3B3229">改本服物价 <tspan fill="#C8102E" font-weight="800">→</tspan> 自动重算 <tspan fill="#C8102E" font-weight="800">→</tspan> 一眼排序</text>
  <text x="64" y="620" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#9A8B75">非官方玩家工具 · 示例价可校准 · 数据版本 v3.2</text>

  <g transform="rotate(-7 1108 610)">
    <rect x="1082" y="584" width="52" height="52" rx="5" fill="none" stroke="#C8102E" stroke-width="2.6" stroke-opacity="0.75"/>
    <text x="1108" y="621" text-anchor="middle" font-family="Songti SC, serif" font-size="28" font-weight="900" fill="#C8102E" opacity="0.8">账</text>
  </g>
</svg>
