  <g transform="translate(0 12) rotate(-5 1088 212)">
    <ellipse cx="1088" cy="212" rx="58" ry="25" fill="none" stroke="#FF6B52" stroke-width="3.5" stroke-opacity="0.95"/>
    <ellipse cx="1090" cy="214" rx="64" ry="28" fill="none" stroke="#FF6B52" stroke-width="1.6" stroke-opacity="0.40"/>
  </g>

  <!-- bottom -->
  <text x="64" y="604" font-family="PingFang SC, sans-serif" font-size="18" font-weight="600" fill="#3B3229">改本服物价 <tspan fill="#C8102E" font-weight="800">→</tspan> 自动重算 <tspan fill="#C8102E" font-weight="800">→</tspan> 一眼排序</text>
  <text x="64" y="652" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#9A8B75">非官方玩家工具 · 示例价可校准 · 数据版本 v3.3</text>

  <g transform="rotate(-7 1108 618)">
    <rect x="1082" y="592" width="52" height="52" rx="5" fill="none" stroke="#C8102E" stroke-width="2.6" stroke-opacity="0.75"/>
    <text x="1108" y="629" text-anchor="middle" font-family="Songti SC, serif" font-size="28" font-weight="900" fill="#C8102E" opacity="0.8">账</text>
  </g>
</svg>
