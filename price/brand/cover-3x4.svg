<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF7EC"/>
      <stop offset="0.55" stop-color="#F6EEDF"/>
      <stop offset="1" stop-color="#EFE1C9"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF4A36"/>
      <stop offset="0.55" stop-color="#D0241A"/>
      <stop offset="1" stop-color="#A80F08"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#D8341F"/>
    </linearGradient>
    <linearGradient id="barCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A5F80"/>
      <stop offset="1" stop-color="#33445F"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#3A2A14" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A2A14" flood-opacity="0.16"/>
    </filter>
    <pattern id="ruled" width="1080" height="72" patternUnits="userSpaceOnUse">
      <path d="M0 71.5H1080" fill="none" stroke="#8B7A62" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1440" fill="url(#paper)"/>
  <rect width="1080" height="1440" fill="url(#ruled)"/>
  <rect x="60" y="56" width="1.5" height="1328" fill="#C8102E" opacity="0.16"/>
  <rect x="1018" y="56" width="1.5" height="1328" fill="#C8102E" opacity="0.16"/>

  <!-- brand -->
  <g filter="url(#softShadow)">
    <rect x="80" y="70" width="88" height="88" rx="20" fill="url(#seal)"/>
  </g>
  <rect x="86" y="76" width="76" height="76" rx="15" fill="none" stroke="#FFF6E8" stroke-opacity="0.35" stroke-width="2"/>
  <text x="124" y="130" text-anchor="middle" font-family="Songti SC, serif" font-size="48" font-weight="900" fill="#FFF8EC">价</text>
  <text x="194" y="113" font-family="PingFang SC, sans-serif" font-size="38" font-weight="700" fill="#14110D">剑网三物价助手</text>
  <text x="196" y="149" font-family="PingFang SC, sans-serif" font-size="15" font-weight="600" letter-spacing="3.2" fill="#8B7A62">JX3 PRICE LEDGER · 玩家自制</text>

  <rect x="806" y="86" width="194" height="52" rx="26" fill="#14110D"/>
  <circle cx="832" cy="112" r="5" fill="#E8B44A"/>
  <text x="902" y="119" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#F8EFDF">免费 · 免下载</text>

  <!-- label -->
  <rect x="80" y="256" width="8" height="28" rx="4" fill="#C8102E"/>
  <text x="106" y="280" font-family="PingFang SC, sans-serif" font-size="25" font-weight="600" letter-spacing="3" fill="#B4472F">剑网3 · 苍生铸世 50 级</text>

  <!-- question -->
  <text x="76" y="380" font-family="Songti SC, serif" font-size="108" font-weight="900" fill="#14110D">今天精力</text>
  <text x="72" y="612" font-family="Songti SC, serif" font-size="228" font-weight="900" fill="#14110D">做什么</text>
  <text x="756" y="612" font-family="Songti SC, serif" font-size="228" font-weight="900" fill="#C8102E">？</text>
  <path d="M 82 646 C 250 638 500 640 738 632" fill="none" stroke="#C8102E" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
  <text x="76" y="706" font-family="PingFang SC, sans-serif" font-size="40" font-weight="600" fill="#3B3229"><tspan fill="#C8102E" font-weight="800">154</tspan> 条制造配方，按本服物价排好队</text>

  <!-- answer card -->
  <g>
    <rect x="76" y="760" width="928" height="490" rx="26" fill="#0B1424" filter="url(#cardShadow)"/>
    <rect x="76" y="760" width="928" height="9" rx="4.5" fill="#C8102E"/>
    <rect x="76.75" y="760.75" width="926.5" height="488.5" rx="25.5" fill="none" stroke="#2A3B55" stroke-width="1.5"/>

    <text x="118" y="818" font-family="Songti SC, serif" font-size="32" font-weight="900" fill="#F5F1E8">本服精力收益榜</text>
    <rect x="368" y="792" width="82" height="30" rx="15" fill="#3A2A12"/>
    <text x="409" y="813" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="15" font-weight="700" fill="#E8B44A">TOP 3</text>
    <text x="962" y="814" text-anchor="end" font-family="PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#8FA3BF">单位：金 / 精力</text>
    <path d="M118 836H962" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- row 1 -->
    <rect x="102" y="850" width="876" height="126" rx="16" fill="#15223A"/>
    <rect x="102" y="868" width="6" height="90" rx="3" fill="#E8543E"/>
    <text x="126" y="906" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#E8B44A">01</text>
    <text x="172" y="906" font-family="PingFang SC, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">归营旌</text>
    <text x="172" y="940" font-family="PingFang SC, sans-serif" font-size="18" font-weight="500" fill="#8FA3BF">梓匠 · 单次 120 精力</text>
    <rect x="470" y="890" width="300" height="12" rx="6" fill="#22314A"/>
    <rect x="470" y="890" width="277" height="12" rx="6" fill="url(#barHot)"/>
    <text x="950" y="914" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#FF7A5C">175.25</text>

    <!-- row 2 -->
    <text x="126" y="1022" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#6E86A6">02</text>
    <text x="172" y="1022" font-family="PingFang SC, sans-serif" font-size="30" font-weight="600" fill="#E8EDF5">膘然心动</text>
    <text x="172" y="1048" font-family="PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#7E90AA">烹饪 · 单次 50 精力</text>
    <rect x="470" y="1010" width="300" height="10" rx="5" fill="#22314A"/>
    <rect x="470" y="1010" width="129" height="10" rx="5" fill="url(#barCool)"/>
    <text x="938" y="1032" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#E8EDF5">81.37</text>

    <!-- row 3 -->
    <text x="126" y="1102" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#6E86A6">03</text>
    <text x="172" y="1102" font-family="PingFang SC, sans-serif" font-size="30" font-weight="600" fill="#E8EDF5">定魂丹砂</text>
    <text x="172" y="1128" font-family="PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#7E90AA">制药 · 单次 120 精力</text>
    <rect x="470" y="1090" width="300" height="10" rx="5" fill="#22314A"/>
    <rect x="470" y="1090" width="90" height="10" rx="5" fill="url(#barCool)"/>
    <text x="938" y="1112" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="600" fill="#E8EDF5">56.68</text>

    <text x="118" y="1200" font-family="PingFang SC, sans-serif" font-size="15" font-weight="500" fill="#7E90AA">剑网三物价助手 · 共 171 条 · 175.25 ÷ 1.33 ≈ 132×</text>
    <rect x="880" y="1178" width="82" height="30" rx="6" fill="none" stroke="#E8543E" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="921" y="1199" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="14" font-weight="700" fill="#E8543E">示例价</text>
  </g>

  <!-- red circle on the answer -->
  <g transform="rotate(-5 892 896)">
    <ellipse cx="892" cy="896" rx="92" ry="34" fill="none" stroke="#FF6B52" stroke-width="4.5" stroke-opacity="0.95"/>
    <ellipse cx="894" cy="899" rx="98" ry="38" fill="none" stroke="#FF6B52" stroke-width="2" stroke-opacity="0.40"/>
  </g>

  <!-- bottom -->
  <text x="540" y="1306" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="25" font-weight="600" fill="#3B3229">改本服物价 <tspan fill="#C8102E" font-weight="800">→</tspan> 自动重算 <tspan fill="#C8102E" font-weight="800">→</tspan> 一眼排序</text>
  <text x="540" y="1356" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="18" font-weight="500" fill="#9A8B75">非官方玩家工具 · 示例价可校准 · 数据版本 v3.3</text>

  <g transform="rotate(-7 974 1338)">
    <rect x="944" y="1308" width="60" height="60" rx="6" fill="none" stroke="#C8102E" stroke-width="3" stroke-opacity="0.75"/>
    <text x="974" y="1350" text-anchor="middle" font-family="Songti SC, serif" font-size="32" font-weight="900" fill="#C8102E" opacity="0.8">账</text>
  </g>
</svg>
