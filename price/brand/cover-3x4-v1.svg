<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.52" stop-color="#071326"/>
      <stop offset="1" stop-color="#0d1e38"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a1f"/>
      <stop offset="0.55" stop-color="#e10600"/>
      <stop offset="1" stop-color="#9f0000"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b4bb3"/>
      <stop offset="1" stop-color="#45a3ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#128a52"/>
      <stop offset="1" stop-color="#5ff0a4"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6e2bbb"/>
      <stop offset="1" stop-color="#c18aff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e8a300"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#e10600" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d6fe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d6fe0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#45a3ff" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#7aa2d8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1440" fill="url(#bg)"/>
  <rect width="1080" height="1440" fill="url(#grid)"/>
  <circle cx="150" cy="360" r="420" fill="url(#glowRed)"/>
  <circle cx="1010" cy="820" r="480" fill="url(#glowBlue)"/>

  <!-- decorative chart / coin on the right -->
  <g opacity="0.5">
    <circle cx="930" cy="445" r="155" fill="none" stroke="#f5b301" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="930" cy="445" r="118" fill="none" stroke="#f5b301" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="930" cy="445" r="82" fill="url(#gold)" opacity="0.92"/>
    <text x="930" y="477" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="76" font-weight="700" fill="#4a3000">金</text>
  </g>

  <!-- brand row -->
  <g filter="url(#shadow)">
    <rect x="80" y="166" width="78" height="78" rx="18" fill="url(#red)"/>
    <text x="119" y="220" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="46" font-weight="700" fill="#ffffff">价</text>
  </g>
  <text x="180" y="206" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">剑网三物价助手</text>
  <text x="182" y="238" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="19" font-weight="600" letter-spacing="4" fill="#7f9bbc">JX3 PRICE LEDGER</text>

  <g>
    <rect x="790" y="174" width="210" height="50" rx="25" fill="#0d1b2f" stroke="#263b56" stroke-width="1"/>
    <circle cx="818" cy="199" r="7" fill="#45d483"/>
    <text x="836" y="207" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="21" font-weight="600" fill="#cfe0f5">苍生铸世 · 50级</text>
  </g>

  <!-- title -->
  <text x="80" y="375" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="#94a3b8">剑网3 · 生活技艺成本榜</text>
  <text x="76" y="478" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="94" font-weight="700" fill="#f8fafc">剑网三</text>
  <text x="76" y="628" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="170" font-weight="700" fill="#f8fafc">物价助手</text>
  <rect x="82" y="654" width="250" height="10" rx="5" fill="url(#red)"/>
  <text x="80" y="715" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="34" font-weight="500" fill="#a9bdd6">每一点精力，都算成收益</text>

  <!-- stat chips -->
  <g>
    <rect x="80" y="756" width="280" height="58" rx="14" fill="#0b1729" stroke="#22334b" stroke-width="1"/>
    <text x="104" y="793" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="26" font-weight="700" fill="#5ff0a4">154</text>
    <text x="168" y="792" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="22" fill="#a9bdd6">条制造配方</text>

    <rect x="380" y="756" width="280" height="58" rx="14" fill="#0b1729" stroke="#22334b" stroke-width="1"/>
    <text x="404" y="793" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="26" font-weight="700" fill="#45a3ff">272</text>
    <text x="468" y="792" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="22" fill="#a9bdd6">项物品价格</text>

    <rect x="680" y="756" width="320" height="58" rx="14" fill="#0b1729" stroke="#22334b" stroke-width="1"/>
    <text x="704" y="793" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="26" font-weight="700" fill="#c18aff">17</text>
    <text x="752" y="792" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="22" fill="#a9bdd6">个服务器独立行情</text>
  </g>

  <!-- ranking card -->
  <g filter="url(#shadow)">
    <rect x="80" y="852" width="920" height="352" rx="26" fill="#071224" stroke="#22334b" stroke-width="1.5"/>
  </g>
  <rect x="80" y="852" width="920" height="6" rx="3" fill="url(#red)"/>
  <text x="116" y="916" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">现在做什么最赚精力？</text>
  <rect x="806" y="894" width="156" height="34" rx="17" fill="#101f35" stroke="#2a3d57" stroke-width="1"/>
  <text x="884" y="917" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="17" font-weight="600" letter-spacing="2" fill="#94a3b8">TOP 3</text>

  <!-- row 1 -->
  <circle cx="126" cy="978" r="22" fill="#2a1740" stroke="#b36bff" stroke-width="1.5"/>
  <text x="126" y="985" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="18" font-weight="700" fill="#c18aff">1</text>
  <text x="166" y="985" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="27" font-weight="600" fill="#f8fafc">璧·苍生</text>
  <text x="166" y="1012" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="17" fill="#7f9bbc">缝纫 · 单次 200 精力</text>
  <rect x="430" y="970" width="390" height="16" rx="8" fill="#14243a"/>
  <rect x="430" y="970" width="390" height="16" rx="8" fill="url(#purple)"/>
  <text x="918" y="985" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="25" font-weight="700" fill="#c18aff">48.98</text>

  <!-- row 2 -->
  <circle cx="126" cy="1057" r="22" fill="#0c2038" stroke="#45a3ff" stroke-width="1.5"/>
  <text x="126" y="1064" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="18" font-weight="700" fill="#8bc6ff">2</text>
  <text x="166" y="1064" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="27" font-weight="600" fill="#f8fafc">玄元松绿衫</text>
  <text x="166" y="1091" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="17" fill="#7f9bbc">缝纫 · 单次 200 精力</text>
  <rect x="430" y="1049" width="390" height="16" rx="8" fill="#14243a"/>
  <rect x="430" y="1049" width="365" height="16" rx="8" fill="url(#blue)"/>
  <text x="918" y="1064" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="25" font-weight="700" fill="#8bc6ff">45.98</text>

  <!-- row 3 -->
  <circle cx="126" cy="1136" r="22" fill="#0c2a22" stroke="#5ff0a4" stroke-width="1.5"/>
  <text x="126" y="1143" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="18" font-weight="700" fill="#8af3bd">3</text>
  <text x="166" y="1143" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="27" font-weight="600" fill="#f8fafc">玄元松绿帽</text>
  <text x="166" y="1170" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="17" fill="#7f9bbc">锻造 · 单次 200 精力</text>
  <rect x="430" y="1128" width="390" height="16" rx="8" fill="#14243a"/>
  <rect x="430" y="1128" width="345" height="16" rx="8" fill="url(#green)"/>
  <text x="918" y="1143" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="25" font-weight="700" fill="#8af3bd">43.63</text>

  <text x="116" y="1192" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="17" fill="#64748b">按每点精力收益排序 · 全站中位 0.67 金/精力</text>

  <!-- bottom disclaimer within safe area -->
  <text x="80" y="1226" font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif" font-size="18" fill="#52657d">非官方玩家工具 · 示例价可校准 · 数据来自当前版本</text>
</svg>
