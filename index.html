<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>百工坊 · 剑网3 工具集</title>
    <meta
      name="description"
      content="百工坊：剑网3 家园蓝图生成与物价助手，家园营造、拼豆蓝图、生活技艺成本与精力收益，一处取用。"
    />
    <link rel="icon" href="./shell/logo/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="./shell/logo/logo-192.png" />
    <link rel="apple-touch-icon" href="./shell/logo/logo-180.png" />
    <style>
      :root {
        --bg: #f7f4ef;
        --panel: #fffdfa;
        --ink: #2c2a26;
        --dim: #7a7268;
        --line: #e2dcd2;
        --accent: #7d5f8c;
        --accent-2: #3f7f8c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14131a;
          --panel: #1d1c24;
          --ink: #ece8f0;
          --dim: #9a94a6;
          --line: #2e2c38;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        align-content: center;
        padding: 56px 24px;
        background:
          radial-gradient(circle at 22% 12%, rgba(125, 95, 140, 0.14), transparent 46%),
          radial-gradient(circle at 82% 84%, rgba(63, 127, 140, 0.12), transparent 46%),
          var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main { width: 100%; max-width: 980px; min-width: 0; }
      .hero { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
      .hero > div { min-width: 0; }
      .hero img {
        width: 92px; height: 92px; border-radius: 22px;
        background: #fff; box-shadow: 0 8px 26px rgba(0, 0, 0, 0.14);
      }
      .hero h1 { margin: 0; font-size: 36px; letter-spacing: 0.1em; }
      .hero p { margin: 8px 0 0; color: var(--dim); font-size: 15px; letter-spacing: 0.04em; }
      .cards { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 40px; }
      .card {
        display: block; padding: 30px 28px; border-radius: 20px; border: 1px solid var(--line);
        background: var(--panel); color: inherit; text-decoration: none;
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      }
      .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 16px 38px rgba(0, 0, 0, 0.13); }
      .card h2 { margin: 0 0 12px; font-size: 22px; letter-spacing: 0.04em; }
      .card p { margin: 0; color: var(--dim); font-size: 14.5px; line-height: 1.75; }
      .card .go { display: inline-block; margin-top: 20px; font-size: 13px; color: var(--accent-2); }
      footer { margin-top: 44px; color: var(--dim); font-size: 12px; text-align: center; letter-spacing: 0.08em; }
      @media (max-width: 560px) {
        .hero { gap: 16px; }
        .hero img { width: 68px; height: 68px; border-radius: 18px; }
        .hero h1 { font-size: 28px; }
        .hero p { font-size: 13px; }
        .cards { margin-top: 28px; gap: 14px; grid-template-columns: 1fr; }
        .card { padding: 22px 20px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <img src="./shell/logo/logo-192.png" alt="" width="72" height="72" />
        <div>
          <h1>百工坊</h1>
          <p>剑网3 工具集 · 家园营造与物价核算</p>
        </div>
      </div>

      <div class="cards">
        <a class="card" href="./homeland/">
          <h2>家园蓝图</h2>
          <p>图片转拼豆蓝图，墙面画与地面图案生成；3D 家具布置、地下室与地块编辑、蓝图导出。</p>
          <span class="go">进入 →</span>
        </a>
        <a class="card" href="./price/">
          <h2>物价助手</h2>
          <p>本服行情、配方成本、精力收益排行；生活技艺投入产出对比与物价走势。</p>
          <span class="go">进入 →</span>
        </a>
      </div>

      <footer>百工坊 · 剑网3 工具集</footer>
    </main>
  </body>
</html>
