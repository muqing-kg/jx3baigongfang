server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm model/gltf-binary
             application/manifest+json;

  # server 层声明 types 会整体替换默认表，必须把 mime.types 一起引进来
  types {
    include                     mime.types;
    application/wasm            wasm;
    model/gltf-binary           glb;
    application/manifest+json   webmanifest;
  }

  # 入口与两个子站：目录访问补 index.html
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Service Worker 每次校验，避免客户端长期跑旧页面
  location = /price/sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }
  location = /price/site/sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }
  location = /price/manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  # 版本与行情数据走实时校验，价格一天多变
  location ~ ^/price/(version|updates)\.json$ {
    add_header Cache-Control "no-cache" always;
  }

  # 带内容哈希的构建产物可以长期缓存
  location ~ "/assets/.+-[A-Za-z0-9_]{8}\.(js|css|woff2?)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ~* \.(png|jpg|jpeg|webp|svg|ico|glb|wasm|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # 下载区的 Excel 模板体积大，允许断点续传
  location /price/downloads/ {
    add_header Accept-Ranges bytes always;
  }
}
